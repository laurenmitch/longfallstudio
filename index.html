<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>laurenmakes</title>
  <link rel="icon" type="image/svg+xml" href="assets/img/lm-logo.svg" />
  <meta name="description" content="Interiors, crafts, and honest design help for real homes on real budgets. Free decorating guides, made alongside my YouTube channel @lauren_makes." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Gabarito:wght@400;500;700;800&family=Inter:wght@400;500&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />

  <style>
    *,*::before,*::after{ box-sizing:border-box; }
    :root{
      --ink:#1a1712; --ink-soft:#5e564a; --blue:#80A4ED; --blue-ink:#3a5bbf;
      --font-display:"Gabarito","Space Grotesk",system-ui,sans-serif;
      --font-body:"Inter",system-ui,-apple-system,sans-serif;
      --font-mono:"Space Mono",ui-monospace,monospace;
      --ease:cubic-bezier(0.22,1,0.36,1);
    }
    html{ -webkit-font-smoothing:antialiased; }
    body{
      margin:0; min-height:100vh; color:var(--ink);
      font-family:var(--font-body); line-height:1.6;
      background:#fdfdfc;
      background-image:
        linear-gradient(to right, rgba(20,20,26,.05) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(20,20,26,.05) 1px, transparent 1px);
      background-size:46px 46px;
      display:flex; flex-direction:column;
    }
    a{ color:inherit; text-decoration:none; }

    /* ---- Nav ---- */
    .nav{
      display:flex; align-items:center; justify-content:space-between;
      padding:1.25rem clamp(1.25rem,4vw,3rem);
    }
    .nav__brand{ font-family:var(--font-display); font-weight:800; font-size:1.25rem; letter-spacing:-.02em; }
    .nav__brand b{ color:var(--blue-ink); font-weight:800; }
    .nav__logo{ height:30px; width:auto; display:block; }
    .nav__yt{
      font-family:var(--font-mono); font-size:.72rem; letter-spacing:.12em; text-transform:uppercase;
      color:var(--ink-soft); border-bottom:2px solid var(--blue); padding-bottom:2px;
      transition:color .3s var(--ease);
    }
    .nav__yt:hover{ color:var(--blue-ink); }

    /* ---- Hero ---- */
    main{ flex:1; display:grid; place-items:center; padding:clamp(2rem,6vh,5rem) clamp(1.25rem,5vw,3rem); }
    .hero{ max-width:760px; text-align:center; }
    .hero__logo{ display:block; height:clamp(96px,16vw,168px); width:auto; margin:0 auto; }
    .hero__eyebrow{
      font-family:var(--font-mono); font-size:.72rem; letter-spacing:.22em; text-transform:uppercase;
      color:var(--blue-ink); margin:1rem 0 0;
    }
    .hero__title{
      font-family:var(--font-display); font-weight:500; line-height:1;
      font-size:clamp(1.5rem,3vw,2.15rem); letter-spacing:-.005em; margin:1.1rem 0 0;
    }
    .hero__title .hl{
      position:relative; display:inline-block; z-index:0;
    }
    .hero__title .hl::before{
      content:""; position:absolute; left:-5%; right:-5%; top:24%; bottom:12%;
      background:var(--blue); transform:rotate(-1.6deg) skewX(-4deg); z-index:-1; border-radius:3px;
    }
    .hero__lead{
      margin:1.75rem auto 0; max-width:48ch;
      font-size:clamp(1.05rem,1.6vw,1.2rem); color:var(--ink-soft);
    }

    /* ---- CTA ---- */
    .hero__cta{ margin-top:2.5rem; display:flex; flex-direction:column; gap:1rem; justify-content:center; align-items:center; }
    .btn{
      display:inline-flex; align-items:center; gap:.6em;
      font-family:var(--font-mono); font-weight:700; font-size:.9rem; letter-spacing:.12em; text-transform:uppercase;
      padding:.95em 1.7em; border-radius:999px;
      background:var(--ink); color:#fff; border:2px solid var(--ink);
      transition:transform .3s var(--ease), background .3s var(--ease), color .3s var(--ease);
    }
    .btn:hover{ background:var(--blue-ink); border-color:var(--blue-ink); transform:translateY(-2px); }
    .btn span{ transition:transform .3s var(--ease); }
    .btn:hover span{ transform:translateX(5px); }
    .btn--outline{ background:transparent; color:var(--ink); }
    .btn--outline:hover{ background:var(--ink); border-color:var(--ink); color:#fff; }
    .hero__note{
      font-family:var(--font-mono); font-size:.68rem; letter-spacing:.1em; text-transform:uppercase;
      color:var(--ink-soft);
    }

    /* ---- Footer ---- */
    footer{
      padding:2rem clamp(1.25rem,4vw,3rem);
      font-family:var(--font-mono); font-size:.68rem; letter-spacing:.08em; text-transform:uppercase;
      color:var(--ink-soft); text-align:center;
    }
    footer a{ border-bottom:1px solid var(--blue); }
    footer p + p{ margin-top:.6rem; }

    @media (prefers-reduced-motion:reduce){ *{ transition-duration:.001ms !important; } }
  </style>
</head>
<body>

  <main>
    <section class="hero">
      <img class="hero__logo" src="assets/img/lm-logo.svg" alt="Lauren Makes · LM monogram" />
      <p class="hero__eyebrow">interiors · crafts · real homes</p>
      <div class="hero__cta">
        <a class="btn" href="decorating-guides/">explore the decorating guides <span>→</span></a>
      </div>
    </section>
  </main>

  <footer>
    <p>Made alongside my YouTube channel, <a href="https://www.youtube.com/@lauren_makes" target="_blank" rel="noopener">@lauren_makes</a>.</p>
  </footer>

</body>
</html>
